@if(isAddingTask){
    <app-new-task />
}
<section id="tasks" class="flex flex-col gap-2">
    <header class="flex flex-row justify-between items-center mb-4">
        <h4 class="text-3xl font-semibold">{{name}}'s Tasks</h4>
        <menu>
            <button (click)="onStartAddTask()" class="flex flex-row items-center gap-2 py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-400 ease-in-out transition-all duration-300 cursor-pointer">
                <lucide-icon [size]="20" name="plus"></lucide-icon>
                Add Task
            </button>
        </menu>
    </header>

    <div class="flex flex-col gap-2">
        @for (task of selectedUserTasks; track task.id) {
            <app-task [task]="task" (complete)="onCompleteTask($event)"/>
        }
    </div>    
</section>
